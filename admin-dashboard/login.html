<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veylora Admin — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f0f11; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md px-6">
    <div class="bg-surface-container-low border border-outline-variant/30 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="font-headline text-2xl text-primary tracking-tight">Veylora Admin</h1>
        <p class="text-outline text-sm mt-2">Sign in to manage your archive</p>
      </div>

      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="username" class="block text-sm font-medium text-on-surface-variant mb-1">Username</label>
          <input type="text" id="username" required
            class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl px-4 py-3 text-on-surface focus:border-primary focus:outline-none transition-colors"
            placeholder="admin"/>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-on-surface-variant mb-1">Password</label>
          <input type="password" id="password" required
            class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl px-4 py-3 text-on-surface focus:border-primary focus:outline-none transition-colors"
            placeholder="••••••••"/>
        </div>
        <button type="submit" id="loginBtn"
          class="w-full bg-primary text-on-primary font-medium py-3 rounded-xl hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <span>Sign In</span>
          <span id="loginSpinner" class="hidden material-symbols-outlined animate-spin">loading</span>
        </button>

        <p id="error" class="text-red-400 text-sm text-center mt-4 hidden"></p>
      </form>

      <p class="text-center text-outline text-xs mt-6">
        Forgot your password? Contact your system administrator.
      </p>
    </div>
  </div>

  <script src="src/js/config.js" data-api-base=""></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginSpinner');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      errorEl.textContent = '';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // UI loading state
      btn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        const res = await api.post('/api/auth/login', { username, password });

        // Server sets HttpOnly session cookie + XSRF-TOKEN cookie.
        // CSRF token is returned in body for use on state-changing requests.
        if (res.csrfToken) {
          // CSRF token is also set as a cookie by the server; the body copy
          // is a convenience for clients that can't read cookies.
          console.debug('CSRF token received');
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed. Please try again.';
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
