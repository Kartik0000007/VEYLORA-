<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veylora Admin — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f0f11; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md px-6">
    <div class="bg-surface-container-low border border-outline-variant/30 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="font-headline text-2xl text-primary tracking-tight">Veylora Admin</h1>
        <p class="text-outline text-sm mt-2">Sign in to manage your archive</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-on-surface-variant mb-1">Username</label>
          <input type="text" id="username" required
            class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl px-4 py-3 text-on-surface focus:border-primary focus:outline-none transition-colors"
            placeholder="admin"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-on-surface-variant mb-1">Password</label>
          <input type="password" id="password" required
            class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl px-4 py-3 text-on-surface focus:border-primary focus:outline-none transition-colors"
            placeholder="••••••••"/>
        </div>
        <button type="submit"
          class="w-full bg-primary text-on-primary font-medium py-3 rounded-xl hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2">
          <span>Sign In</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <p id="error" class="text-red-400 text-sm text-center mt-4 hidden"></p>
      <p class="text-center text-outline text-xs mt-6">
        Default: admin / admin123 <br/>
        Change password after first login.
      </p>
    </div>
  </div>

  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      try {
        const res = await api.post('/api/auth/login', { username, password });
        localStorage.setItem('veylora_admin_token', res.token);
        localStorage.setItem('veylora_admin_user', JSON.stringify(res.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
