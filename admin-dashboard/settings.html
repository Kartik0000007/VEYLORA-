<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veylora Admin — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f0f11; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
  <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-surface-container-low border-r border-outline-variant/30 transform -translate-x-full transition-transform duration-300" id="sidebar">
    <div class="flex items-center justify-between px-6 py-4">
      <span class="font-bold text-xl text-primary">Veylora</span>
      <button id="closeSidebar" class="text-outline-variant hover:text-on-surface">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <nav class="px-4 py-2 space-y-1">
      <a href="dashboard.html" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">dashboard</span> Dashboard
      </a>
      <a href="products.html" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">inventory_2</span> Products
      </a>
      <a href="categories.html" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">category</span> Categories
      </a>
      <a href="settings.html" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg bg-primary text-on-primary">
        <span class="material-symbols-outlined">settings</span> Settings
      </a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-outline-variant/30">
      <button id="logoutBtn" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-red-400 hover:bg-red-400/10 transition-colors">
        <span class="material-symbols-outlined">logout</span> Sign Out
      </button>
    </div>
  </aside>

  <div id="overlay" class="fixed inset-0 z-40 bg-black/50 hidden" onclick="toggleSidebar()"></div>

  <div class="flex-1 pl-0 lg:pl-64 p-6">
    <header class="flex items-center justify-between mb-8">
      <div>
        <button id="openSidebar" class="lg:hidden text-outline-variant">
          <span class="material-symbols-outlined text-2xl">menu</span>
        </button>
        <h1 class="text-2xl font-bold text-on-surface">Site Settings</h1>
      </div>
    </header>

    <div class="max-w-2xl">
      <form id="settingsForm" class="bg-surface-container-low border border-outline-variant/30 rounded-xl p-6 space-y-6">
        <div>
          <h2 class="font-bold text-lg text-on-surface mb-4">Brand &amp; Hero</h2>
          <div class="space-y-4" id="settingsContainer">
            <!-- Settings injected here by JS -->
          </div>
        </div>
        <div class="flex justify-end">
          <button type="submit" class="px-8 py-3 rounded-lg bg-primary text-on-primary hover:bg-primary-fixed transition-colors font-medium">
            Save Settings
          </button>
        </div>
      </form>

      <div class="mt-8 p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-sm text-red-400">
        <p class="font-medium">⚠️ After saving settings, redeploy the website on Vercel for changes to appear.</p>
      </div>
    </div>
  </div>

  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script>
    requireAuth();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('veylora_admin_token');
      localStorage.removeItem('veylora_admin_user');
      window.location.href = 'login.html';
    });

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('overlay').classList.toggle('hidden');
    }
    document.getElementById('openSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);

    const container = document.getElementById('settingsContainer');

    async function loadSettings() {
      try {
        const settings = await api.get('/api/settings');
        container.innerHTML = '';
        Object.entries(settings).forEach(([key, value]) => {
          const div = document.createElement('div');
          div.className = 'grid grid-cols-1 md:grid-cols-3 gap-4 items-end p-4 border border-outline-variant/20 rounded-lg bg-surface-container-lowest/50';
          div.innerHTML = `
            <label class="text-sm font-medium text-on-surface-variant">${key}</label>
            <input type="text" data-key="${key}" value="${value || ''}"
              class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl px-4 py-3 text-on-surface focus:border-primary focus:outline-none"/>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-red-400">Failed to load settings</p>';
      }
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputs = container.querySelectorAll('input[data-key]');
      try {
        for (const input of inputs) {
          await api.put(`/api/settings/${input.dataset.key}`, { setting_value: input.value });
        }
        alert('Settings saved successfully!');
      } catch (err) { alert(err.message || 'Save failed'); }
    });

    loadSettings();
  </script>
</body>
</html>
