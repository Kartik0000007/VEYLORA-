name: Deploy Veylora

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # -----------------------------------------------------------
  # Job 1: Build static data from API
  # Fetches products/categories/settings from backend and
  # writes JSON files to website/frontend/data/
  # -----------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build-step.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run static build (API → JSON)
        id: build-step
        run: node build.js
        working-directory: ./scripts
        env:
          API_BASE: ${{ secrets.API_BACKEND_URL }}

      - name: Commit regenerated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add website/frontend/data/
          git commit -m "chore: regenerate static data from API" || echo "No changes to commit"
          git push

  # -----------------------------------------------------------
  # Job 2: Deploy main website to Vercel
  # -----------------------------------------------------------
  deploy-website:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          working-directory: ./website
          vercel-args: '--prod'

  # -----------------------------------------------------------
  # Job 3: Deploy admin dashboard to Vercel
  # -----------------------------------------------------------
  deploy-admin:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Admin Dashboard to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: ./admin-dashboard
          vercel-args: '--prod'

  # -----------------------------------------------------------
  # Job 4: Deploy backend to Render (via deploy hook)
  # -----------------------------------------------------------
  deploy-backend:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
