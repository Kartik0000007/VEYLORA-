name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # -----------------------------------------------------------
  # Job 1: Lint and syntax validation
  # -----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax-check backend JS files
        run: |
          for f in backend/src/**/*.js backend/scripts/**/*.js scripts/**/*.js; do
            node --check "$f" || exit 1
          done

      - name: Syntax-check frontend JS files
        run: |
          for f in website/frontend/scripts/**/*.js admin-dashboard/src/js/**/*.js; do
            node --check "$f" || exit 1
          done

      - name: Verify no secrets committed
        run: |
          if grep -rqi "password\|secret\|api_key\|apikey" .env.example 2>/dev/null; then
            echo "WARNING: .env.example may contain sensitive values"
          fi
          test ! -f .env || { echo "ERROR: .env file committed"; exit 1; }

  # -----------------------------------------------------------
  # Job 2: Validate build script configuration
  # -----------------------------------------------------------
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate build script syntax
        run: node --check scripts/build.js

      - name: Verify build output directory reference
        run: |
          if grep -q "website/frontend/data" scripts/build.js; then
            echo "✓ Build script outputs to website/frontend/data/"
          else
            echo "ERROR: Build script output directory mismatch"
            exit 1
          fi

  # -----------------------------------------------------------
  # Job 3: Validate environment template
  # -----------------------------------------------------------
  validate-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .env.example has required variables
        run: |
          for var in DATABASE_URL JWT_SECRET CORS_ORIGIN PORT NODE_ENV; do
            if grep -q "^${var}=" .env.example; then
              echo "✓ $var defined in .env.example"
            else
              echo "ERROR: $var missing from .env.example"
              exit 1
            fi
          done
